services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: harmoniq
      POSTGRES_USER: harmoniq
      POSTGRES_PASSWORD: harmoniq_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harmoniq"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: ${HARMONIQ_IMAGE:-harmoniq-backend:dev}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: alembic upgrade head
    environment:
      DATABASE_URL_SYNC: postgresql+psycopg2://harmoniq:harmoniq_dev@postgres:5432/harmoniq
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${HARMONIQ_IMAGE:-harmoniq-backend:dev}
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL_SYNC: postgresql+psycopg2://harmoniq:harmoniq_dev@postgres:5432/harmoniq
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      HARMONIQ_CORS_ORIGINS: http://localhost:8081,http://localhost:19006
    volumes:
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    image: ${HARMONIQ_IMAGE:-harmoniq-backend:dev}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1
    environment:
      DATABASE_URL_SYNC: postgresql+psycopg2://harmoniq:harmoniq_dev@postgres:5432/harmoniq
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  pgdata:
