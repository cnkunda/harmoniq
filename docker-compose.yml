version: "3.9"

# Harmoniq — Full stack: API + Celery worker + Redis + Observability + MLflow
# Usage: docker compose up

services:
  # ── Redis (job store + Celery broker) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - HARMONIQ_CORS_ORIGINS=http://localhost:8081,http://localhost:19006
    env_file:
      - backend/.env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
      - ./backend/app:/app/app  # Hot reload in dev
    restart: unless-stopped

  # ── Celery Worker ──────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.queue worker --loglevel=info --concurrency=2
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - backend/.env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  # ── Model Server (TFLite inference) ────────────────────────────────────────
  model-server:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.model_server:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CHORD_MODEL_PATH=/app/models/chord_model.tflite
    volumes:
      - ./backend/models:/app/models:ro
    restart: unless-stopped

  # ── MLflow (experiment tracking + model registry) ──────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

  # ── Prometheus (metrics) ───────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  # ── Grafana (dashboards) ───────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=harmoniq
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis_data:
  backend_data:
  mlflow_data:
  prometheus_data:
  grafana_data:
