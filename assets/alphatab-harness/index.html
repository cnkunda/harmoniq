<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Harmoniq — AlphaTab harness</title>
  <style>
    :root {
      --bg-color: #2B1D0E;
      --scrollbar-track: rgba(61, 35, 23, 0.92);
      --scrollbar-thumb: #d4a574;
      --scrollbar-thumb-hover: #e8b86d;
    }
    :root[data-theme="light"] {
      --bg-color: #F5F0E8;
      --scrollbar-track: rgba(200, 190, 175, 0.6);
      --scrollbar-thumb: #b8956a;
      --scrollbar-thumb-hover: #a08055;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg-color);
      overflow: hidden;
      -webkit-touch-callout: none;
      user-select: none;
    }
    /*
     * Column: scroll row (#alphatab = scrollElement) + bottom strip below the scrollbar.
     * Keep scrollbar rules in sync with src/constants/alphaTabPlayerUi.ts (ALPHATAB_SCROLLBAR_CSS).
     */
    #alphatab-shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      min-height: 240px;
      box-sizing: border-box;
    }
    #alphatab {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
    }
    #alphatab::-webkit-scrollbar {
      height: 10px;
    }
    #alphatab::-webkit-scrollbar-track {
      background: var(--scrollbar-track);
      border-radius: 5px;
    }
    #alphatab::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 5px;
      border: 2px solid var(--scrollbar-track);
    }
    #alphatab::-webkit-scrollbar-thumb:hover {
      background: var(--scrollbar-thumb-hover);
    }
    .alphatab-bottom-inset {
      height: 20px;
      flex-shrink: 0;
      width: 100%;
      background: var(--bg-color);
    }
    /*
     * Player cursors — https://alphatab.net/docs/guides/styling-player
     * Colors: keep in sync with src/constants/alphaTabPlayerUi.ts (wood/amber harness).
     */
    .at-cursor-bar {
      background: rgba(212, 165, 116, 0.22);
    }
    .at-cursor-beat {
      background: #E8B86D;
      width: 3px;
      box-shadow: 0 0 2px rgba(44, 24, 16, 0.45);
    }
    /* Theme success — heads, stems, flags, <use> glyphs; keep in sync with src/constants/alphaTabPlayerUi.ts */
    path.at-highlight,
    polygon.at-highlight,
    circle.at-highlight,
    ellipse.at-highlight,
    rect.at-highlight,
    use.at-highlight,
    text.at-highlight,
    tspan.at-highlight,
    .at-highlight path,
    .at-highlight polygon,
    .at-highlight circle,
    .at-highlight ellipse,
    .at-highlight rect,
    .at-highlight use,
    .at-highlight text,
    .at-highlight tspan {
      fill: #7A9B6D;
      stroke: #7A9B6D;
      stroke-width: 1.8px;
    }
    line.at-highlight,
    polyline.at-highlight,
    .at-highlight line,
    .at-highlight polyline {
      stroke: #7A9B6D;
    }
    svg g:has(> .at-highlight) :is(path, line, polyline, use, text, tspan) {
      fill: #7A9B6D !important;
      stroke: #7A9B6D !important;
      stroke-width: 1.8px;
    }
    svg g:has(> .at-highlight) line,
    svg g:has(> .at-highlight) polyline {
      fill: none !important;
    }
  </style>
</head>
<body>
  <div id="alphatab-shell">
    <div id="alphatab"></div>
    <div class="alphatab-bottom-inset" aria-hidden="true"></div>
  </div>
  <!-- Pinned — never use @latest (PRIORITIES 45): @coderline/alphatab@1.6.1 -->
  <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.6.1/dist/alphaTab.min.js"></script>
  <script>
    (function () {
      'use strict'

      function preventUiHooks() {
        document.addEventListener('contextmenu', function (e) {
          e.preventDefault()
        }, { capture: true })
        document.addEventListener('click', function (e) {
          var t = e.target
          if (!t || !t.closest) return
          var a = t.closest('a[href]')
          if (a && a.getAttribute('href') && a.getAttribute('href') !== '#') {
            e.preventDefault()
            e.stopPropagation()
          }
        }, true)
      }

      preventUiHooks()

      var container = document.getElementById('alphatab')
      if (!container || typeof alphaTab === 'undefined' || !alphaTab.AlphaTabApi) {
        console.error('Harmoniq harness: AlphaTab failed to load')
        return
      }

      var externalAudio = new Audio()
      externalAudio.preload = 'auto'
      externalAudio.crossOrigin = 'anonymous'
      /** Mirrors RN stem mixer rate — AlphaTab `playbackSpeed` must match for follow-scroll at slow speeds. */
      var stemPlaybackRate = 1
      var readOnlyFollowMode = false
      /**
       * Pinned banks — keep in sync with `src/audio/soundfontProfiles.ts` and `assets/soundfonts/SOURCES.md` (Commit 60).
       * @type {Record<string, string>}
       */
      var SOUNDFONT_PROFILE_URLS = {
        general_user:
          'https://cdn.jsdelivr.net/gh/ad-si/GeneralUser@f553a9866915130d5fffaa01e457ad53c60bef82/GeneralUser.sf2',
        fluid_r3_mono:
          'https://cdn.jsdelivr.net/gh/musescore/MuseScore@master/share/sound/FluidR3Mono_GM.sf3',
      }
      var DEFAULT_SOUNDFONT_PROFILE_ID = 'general_user'
      var SOUNDFONT_URL = SOUNDFONT_PROFILE_URLS[DEFAULT_SOUNDFONT_PROFILE_ID]
      var currentSoundFontProfileId = DEFAULT_SOUNDFONT_PROFILE_ID
      var pendingSoundFontTimeout = null
      var soundFontCompletionProfileId = DEFAULT_SOUNDFONT_PROFILE_ID

      var layoutHorizontal =
        alphaTab.LayoutMode && alphaTab.LayoutMode.Horizontal !== undefined
          ? alphaTab.LayoutMode.Horizontal
          : 1
      var scrollFollow =
        alphaTab.ScrollMode && alphaTab.ScrollMode.OffScreen !== undefined
          ? alphaTab.ScrollMode.OffScreen
          : 2

      var api = new alphaTab.AlphaTabApi(container, {
        core: {
          useWorkers: false,
          enableLazyLoading: false,
          scriptFile: 'https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.6.1/dist/alphaTab.min.js',
        },
        display: {
          resources: {
            /* Sync: src/constants/tabHarnessTheme.ts — DESIGN_SYSTEM theme white / amber.light / muted.brown */
            mainGlyphColor: '#FFFFFF',
            secondaryGlyphColor: '#E8B86D',
            barSeparatorColor: '#9B8D7B',
            scoreInfoColor: '#8B7D6B',
            staffLineColor: '#9B8D7B',
            barNumberColor: '#8B7D6B',
          },
          scale: 1.1,
          layoutMode: layoutHorizontal,
          stretchForce: 1,
        },
        soundFont: SOUNDFONT_URL,
        player: {
          enablePlayer: true,
          enableCursor: true,
          enableElementHighlighting: true,
          playerMode: alphaTab.PlayerMode.EnabledExternalMedia,
          soundFont: SOUNDFONT_URL,
          scrollMode: scrollFollow,
          nativeBrowserSmoothScroll: false,
          scrollSpeed: 0,
          // Default is html,body — we hide body overflow; scroll the wide score inside #alphatab instead.
          scrollElement: container,
        },
      })

      function scheduleSoundFontFallback(reasonMsg) {
        postOut({
          type: 'soundFontLoad',
          status: 'error',
          profileId: soundFontCompletionProfileId,
          message: reasonMsg ? reasonMsg : 'SoundFont load failed',
        })
        if (soundFontCompletionProfileId !== DEFAULT_SOUNDFONT_PROFILE_ID) {
          applySoundFontProfile(DEFAULT_SOUNDFONT_PROFILE_ID, true)
        }
      }

      function applySoundFontProfile(profileId, isQuietFallback) {
        var url = SOUNDFONT_PROFILE_URLS[profileId]
        if (!url) {
          postOut({
            type: 'soundFontLoad',
            status: 'error',
            profileId: profileId,
            message: 'Unknown SoundFont profile',
          })
          return
        }
        soundFontCompletionProfileId = profileId
        currentSoundFontProfileId = profileId
        if (!isQuietFallback) {
          postOut({ type: 'soundFontLoad', status: 'loading', profileId: profileId })
        }
        if (pendingSoundFontTimeout) clearTimeout(pendingSoundFontTimeout)
        pendingSoundFontTimeout = setTimeout(function () {
          pendingSoundFontTimeout = null
          scheduleSoundFontFallback('SoundFont load timed out')
        }, 25000)
        try {
          api.loadSoundFontFromUrl(url, false)
        } catch (eSf) {
          scheduleSoundFontFallback(eSf && eSf.message ? eSf.message : 'loadSoundFontFromUrl failed')
        }
      }

      function wireHarnessSoundFontEvents() {
        if (api.soundFontLoad && typeof api.soundFontLoad.on === 'function') {
          api.soundFontLoad.on(function (e) {
            postOut({
              type: 'soundFontLoad',
              status: 'loading',
              profileId: soundFontCompletionProfileId,
              loaded: typeof e.loaded === 'number' ? e.loaded : undefined,
              total: typeof e.total === 'number' ? e.total : undefined,
            })
          })
        }
        if (api.soundFontLoaded && typeof api.soundFontLoaded.on === 'function') {
          api.soundFontLoaded.on(function () {
            if (pendingSoundFontTimeout) {
              clearTimeout(pendingSoundFontTimeout)
              pendingSoundFontTimeout = null
            }
            postOut({
              type: 'soundFontLoad',
              status: 'loaded',
              profileId: soundFontCompletionProfileId,
            })
          })
        }
        if (api.soundFontLoadFailed && typeof api.soundFontLoadFailed.on === 'function') {
          api.soundFontLoadFailed.on(function (err) {
            var m = err && err.message ? err.message : 'SoundFont load failed'
            scheduleSoundFontFallback(m)
          })
        }
      }

      wireHarnessSoundFontEvents()

      /** Commit 61 — runtime diagnostics (5s windows); thresholds match docs/MANUAL_QA.md */
      var runtimeDiagEnabled = false
      var runtimeDiagInterval = null
      var RD_WINDOW_MS = 5000
      var rdWindowNote = 0
      var rdWindowRender = 0
      var rdDriftSum = 0
      var rdDriftN = 0

      function resetRuntimeDiagWindow() {
        rdWindowNote = 0
        rdWindowRender = 0
        rdDriftSum = 0
        rdDriftN = 0
      }

      function bumpRuntimeDiagNote() {
        if (runtimeDiagEnabled) rdWindowNote += 1
      }

      function emitRuntimeDiagWindow() {
        if (!runtimeDiagEnabled) return
        var wMs = RD_WINDOW_MS
        var sec = wMs / 1000
        var hz = rdWindowNote / sec
        var rps = rdWindowRender / sec
        var drift = rdDriftN > 0 ? rdDriftSum / rdDriftN : null
        var breaches = []
        if (drift !== null && drift > 80) breaches.push('DRIFT_MS')
        if (hz > 36) breaches.push('NOTE_EVENT_HZ')
        if (rps > 90) breaches.push('RENDER_CHURN')
        postOut({
          type: 'runtimeDiagnostics',
          windowMs: wMs,
          driftMs: drift,
          noteEventHz: hz,
          renderFps: rps,
          breachFlags: breaches,
        })
        resetRuntimeDiagWindow()
      }

      function setRuntimeDiagEnabled(on) {
        runtimeDiagEnabled = !!on
        if (runtimeDiagInterval) {
          clearInterval(runtimeDiagInterval)
          runtimeDiagInterval = null
        }
        if (runtimeDiagEnabled) {
          resetRuntimeDiagWindow()
          runtimeDiagInterval = setInterval(emitRuntimeDiagWindow, RD_WINDOW_MS)
        }
      }

      var currentTranspose = 0
      var lastNoteEventAt = 0
      /** Keep equal to `ALPHA_TAB_NOTE_EVENT_MIN_INTERVAL_MS` in src/constants/alphaTabBridge.ts */
      var NOTE_EVENT_MIN_MS = 31
      var pendingNoteEventPayload = null
      var pendingNoteEventTimer = null
      var loopBracketEl = null
      var loopState = null
      /** Dedup static `songDetails` posts; reset on each `setScore`. */
      var lastSongDetailsJson = ''
      var lastSongPlaybackBar = -1
      /** Sentinel so first real section compares unequal to initial. */
      var lastSongPlaybackLabel = '\u0000'

      function extractSongMeta(score) {
        var out = {}
        if (!score) return out
        try {
          if (typeof score.title === 'string' && score.title.trim()) out.title = score.title.trim()
          if (typeof score.artist === 'string' && score.artist.trim()) out.artist = score.artist.trim()
          if (typeof score.album === 'string' && score.album.trim()) out.album = score.album.trim()
          if (typeof score.subTitle === 'string' && score.subTitle.trim()) out.subTitle = score.subTitle.trim()
          if (typeof score.words === 'string' && score.words.trim()) out.words = score.words.trim()
          if (typeof score.music === 'string' && score.music.trim()) out.music = score.music.trim()
          if (typeof score.tab === 'string' && score.tab.trim()) out.tab = score.tab.trim()
          if (typeof score.tempo === 'number' && Number.isFinite(score.tempo) && score.tempo > 0) {
            out.tempoBpm = score.tempo
          }
          var mbs = score.masterBars
          var markers = []
          if (Array.isArray(mbs)) {
            for (var bi = 0; bi < mbs.length; bi++) {
              var mb = mbs[bi]
              if (!mb || !mb.section) continue
              var tx = mb.section.text
              if (typeof tx === 'string' && tx.trim()) {
                markers.push({ startMasterBarIndex: bi, label: tx.trim() })
              }
            }
          }
          if (markers.length) out.sectionMarkers = markers
        } catch (eMeta) {}
        return out
      }

      function resolveMasterBarIndexFromTick(tick) {
        try {
          var tc = api.tickCache
          if (!tc || typeof tc.findBeat !== 'function') return null
          var beat = tc.findBeat(tick)
          if (!beat) return null
          var voice = beat.voice
          if (!voice || !voice.bar) return null
          var mb = voice.bar.masterBar
          if (!mb || typeof mb.index !== 'number') return null
          return mb.index
        } catch (e) {
          return null
        }
      }

      function sectionLabelAtBar(score, idx) {
        var mbs = score.masterBars
        if (!Array.isArray(mbs) || mbs.length === 0) return null
        var cap = Math.min(Math.max(0, idx), mbs.length - 1)
        var label = null
        for (var i = 0; i <= cap; i++) {
          var mb = mbs[i]
          if (mb && mb.section && typeof mb.section.text === 'string') {
            var t = mb.section.text.trim()
            if (t) label = t
          }
        }
        return label
      }

      function maybePostSongPlayback() {
        var score = api.score
        if (!score || !Array.isArray(score.masterBars)) return
        var tick =
          typeof api.tickPosition === 'number' && Number.isFinite(api.tickPosition) ? api.tickPosition : 0
        var mbIdx = resolveMasterBarIndexFromTick(tick)
        if (mbIdx === null || mbIdx < 0) mbIdx = 0
        var label = sectionLabelAtBar(score, mbIdx)
        var labStr = label == null ? '' : String(label)
        if (mbIdx === lastSongPlaybackBar && labStr === lastSongPlaybackLabel) return
        lastSongPlaybackBar = mbIdx
        lastSongPlaybackLabel = labStr
        postOut({ type: 'songPlayback', masterBarIndex: mbIdx, sectionLabel: label })
      }

      function postSongDetailsPayload(opt) {
        var meta = extractSongMeta(api.score)
        var force = opt && opt.requestId
        try {
          var js = JSON.stringify(meta)
          if (!force && js === lastSongDetailsJson) return
          lastSongDetailsJson = js
        } catch (eJ) {}
        var payload = { type: 'songDetails', score: meta }
        if (opt && typeof opt.requestId === 'string' && opt.requestId) payload.requestId = opt.requestId
        postOut(payload)
      }

      function resetSongMetaForNewScore() {
        lastSongDetailsJson = ''
        lastSongPlaybackBar = -1
        lastSongPlaybackLabel = '\u0000'
      }

      function ensureLoopBracket() {
        if (loopBracketEl && loopBracketEl.parentNode === container) return
        loopBracketEl = document.createElement('div')
        loopBracketEl.id = 'harmoniq-loop-bracket'
        loopBracketEl.setAttribute('aria-hidden', 'true')
        loopBracketEl.style.cssText =
          'display:none;position:absolute;pointer-events:none;z-index:50;border:2px solid rgba(240,222,180,0.92);border-radius:6px;background:rgba(240,222,180,0.06);box-sizing:border-box;'
        container.appendChild(loopBracketEl)
      }

      function hideLoopBracket() {
        loopState = null
        if (loopBracketEl) loopBracketEl.style.display = 'none'
      }

      function layoutLoopBracket() {
        if (!loopState || loopState.startBarIndex >= loopState.endBarIndexExclusive) {
          hideLoopBracket()
          return
        }
        ensureLoopBracket()
        var lookup = api.boundsLookup || (api.renderer && api.renderer.boundsLookup)
        var startIdx = loopState.startBarIndex
        var endEx = loopState.endBarIndexExclusive
        var minX = Infinity
        var minY = Infinity
        var maxX = -Infinity
        var maxY = -Infinity
        var any = false
        if (lookup && typeof lookup.findMasterBarByIndex === 'function') {
          for (var b = startIdx; b < endEx; b++) {
            var mb = lookup.findMasterBarByIndex(b)
            if (!mb) continue
            var vb = mb.visualBounds || mb.realBounds
            if (!vb || typeof vb.x !== 'number' || typeof vb.y !== 'number') continue
            var w = typeof vb.w === 'number' ? vb.w : 0
            var h = typeof vb.h === 'number' ? vb.h : 0
            any = true
            minX = Math.min(minX, vb.x)
            minY = Math.min(minY, vb.y)
            maxX = Math.max(maxX, vb.x + w)
            maxY = Math.max(maxY, vb.y + h)
          }
        }
        if (!any) {
          var score = api.score
          var total = score && score.masterBars && score.masterBars.length ? score.masterBars.length : 0
          if (total <= 0 || !loopBracketEl) {
            if (loopBracketEl) loopBracketEl.style.display = 'none'
            return
          }
          var cw = container.clientWidth || 1
          var ch = container.clientHeight || 120
          var left = (startIdx / total) * cw
          var width = Math.max(8, ((endEx - startIdx) / total) * cw)
          loopBracketEl.style.left = left + 'px'
          loopBracketEl.style.top = '8px'
          loopBracketEl.style.width = width + 'px'
          loopBracketEl.style.height = Math.max(48, ch - 16) + 'px'
          loopBracketEl.style.display = 'block'
          return
        }
        var sl = container.scrollLeft || 0
        var st = container.scrollTop || 0
        loopBracketEl.style.left = minX - sl + 'px'
        loopBracketEl.style.top = minY - st + 'px'
        loopBracketEl.style.width = Math.max(4, maxX - minX) + 'px'
        loopBracketEl.style.height = Math.max(4, maxY - minY) + 'px'
        loopBracketEl.style.display = 'block'
      }

      function scrollMasterBarIntoViewBar(barIndex, attempt) {
        var idx = Math.max(0, Math.floor(barIndex))
        var att = typeof attempt === 'number' ? attempt : 0
        var lookup = api.boundsLookup || (api.renderer && api.renderer.boundsLookup)
        var mb = lookup && typeof lookup.findMasterBarByIndex === 'function' ? lookup.findMasterBarByIndex(idx) : null
        var vb = mb ? mb.visualBounds || mb.realBounds : null
        var cw = container.clientWidth || 0
        if (cw <= 0 && att < 6) {
          requestAnimationFrame(function () {
            scrollMasterBarIntoViewBar(barIndex, att + 1)
          })
          return
        }
        var MAX_BOUNDS_ATTEMPTS = 18
        if (!vb || typeof vb.x !== 'number') {
          if (att < MAX_BOUNDS_ATTEMPTS) {
            requestAnimationFrame(function () {
              scrollMasterBarIntoViewBar(barIndex, att + 1)
            })
          } else {
            try {
              console.warn(
                '[Harmoniq harness] scrollMasterBarIntoView: no bounds for master bar',
                idx,
                'after',
                MAX_BOUNDS_ATTEMPTS,
                'attempts',
              )
            } catch (e) {}
          }
          return
        }
        var bw = typeof vb.w === 'number' ? vb.w : 0
        var barLeft = vb.x
        var barRight = vb.x + bw
        var sl = container.scrollLeft
        var viewRight = sl + cw
        var margin = 32
        var next = sl
        if (barLeft < sl + margin) {
          next = Math.max(0, barLeft - margin)
        } else if (barRight > viewRight - margin) {
          var maxScroll = Math.max(0, container.scrollWidth - cw)
          next = Math.min(maxScroll, barRight - cw + margin)
        }
        container.scrollLeft = next
        layoutLoopBracket()
      }

      container.addEventListener(
        'scroll',
        function () {
          layoutLoopBracket()
        },
        { passive: true },
      )

      function postOut(msg) {
        try {
          var data = JSON.stringify(msg)
          if (window.ReactNativeWebView && typeof window.ReactNativeWebView.postMessage === 'function') {
            window.ReactNativeWebView.postMessage(data)
          }
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(data, '*')
          }
        } catch (err) {
          console.warn('Harmoniq harness postOut', err)
        }
      }

      function parseInbound(data) {
        if (data == null) return null
        if (typeof data === 'string') {
          try {
            return JSON.parse(data)
          } catch (_) {
            return null
          }
        }
        if (typeof data === 'object' && data.type) return data
        return null
      }

      /**
       * External media sync — see https://alphatab.net/docs/guides/audio-video-sync (Custom External Media Player).
       * Harmoniq: audible stems run in RN (mixer); timeline is pushed via syncTimelineMs (~50–200ms).
       * Handler matches the doc's IExternalMediaHandler shape; play() is a no-op so we do not double guitar vs stems.
       */
      function applyStemPlaybackSpeedToApi() {
        try {
          api.playbackSpeed = stemPlaybackRate
        } catch (e) {
          /* ignore */
        }
      }

      function updatePositionFromAudio() {
        if (!externalAudio.src) return
        var pr = externalAudio.playbackRate || 1
        var ms = (externalAudio.currentTime / pr) * 1000
        try {
          if (api.player && api.player.output && typeof api.player.output.updatePosition === 'function') {
            api.player.output.updatePosition(ms)
          }
        } catch (e) {
          postOut({ type: 'error', message: (e && e.message) ? e.message : 'updatePosition failed' })
        }
        maybePostSongPlayback()
      }

      function wireExternalMediaHandler() {
        var handler = {
          get backingTrackDuration() {
            var d = externalAudio.duration
            return Number.isFinite(d) ? d * 1000 : 0
          },
          get playbackRate() {
            return externalAudio.playbackRate || stemPlaybackRate
          },
          set playbackRate(v) {
            stemPlaybackRate = Number.isFinite(v) ? Math.max(0.25, Math.min(1.25, v)) : 1
            externalAudio.playbackRate = stemPlaybackRate
            applyStemPlaybackSpeedToApi()
          },
          get masterVolume() {
            return externalAudio.volume
          },
          set masterVolume(v) {
            externalAudio.volume = Number.isFinite(v) ? v : 1
          },
          seekTo: function (timeMs) {
            var ms = Math.max(0, Number(timeMs))
            var pr = stemPlaybackRate
            externalAudio.currentTime = (ms * pr) / 1000
            try {
              if (api.player && api.player.output && typeof api.player.output.updatePosition === 'function') {
                api.player.output.updatePosition(ms)
              }
            } catch (e) {
              postOut({ type: 'error', message: (e && e.message) ? e.message : 'handler seekTo failed' })
            }
            maybePostSongPlayback()
            if (!readOnlyFollowMode) {
              postOut({ type: 'scoreSeek', positionMs: ms })
            }
          },
          // Host calls api.play()/pause via setStemPlaybackActive; real audio is the stem mixer, not this element.
          play: function () {
            return Promise.resolve()
          },
          pause: function () {
            try {
              externalAudio.pause()
            } catch (e) {
              /* ignore */
            }
          },
        }
        try {
          var out = api.player && api.player.output
          if (out) {
            try {
              out.handler = handler
              return
            } catch (eAssign) {
              /* fall through */
            }
          }
          if (api.player && typeof api.player.setExternalMediaHandler === 'function') {
            api.player.setExternalMediaHandler(handler)
            return
          }
          if (out && typeof out.setExternalMediaHandler === 'function') {
            out.setExternalMediaHandler(handler)
            return
          }
        } catch (e) {
          postOut({ type: 'error', message: (e && e.message) ? e.message : 'external media handler failed' })
        }
      }

      function flushPendingNoteEventFromMidi() {
        pendingNoteEventTimer = null
        if (!pendingNoteEventPayload) return
        var p = pendingNoteEventPayload
        pendingNoteEventPayload = null
        lastNoteEventAt = Date.now()
        postOut(p)
        bumpRuntimeDiagNote()
      }

      function emitNoteEventFromMidiEvent(evt) {
        if (Array.isArray(evt)) {
          for (var i = 0; i < evt.length; i += 1) emitNoteEventFromMidiEvent(evt[i])
          return
        }
        if (!evt || typeof evt !== 'object') return

        var velocity = typeof evt.velocity === 'number' ? evt.velocity : 1
        if (velocity <= 0) return

        var typeName = ''
        if (typeof evt.type === 'number') {
          typeName = String(evt.type)
        } else if (typeof evt.eventType === 'number') {
          typeName = String(evt.eventType)
        }
        if (typeName && typeName !== '9' && typeName !== 'NoteOn') {
        }

        var midi = null
        if (typeof evt.noteValue === 'number') midi = evt.noteValue
        else if (typeof evt.noteNumber === 'number') midi = evt.noteNumber
        else if (typeof evt.note === 'number') midi = evt.note
        if (!Number.isFinite(midi)) return

        var beat = 0
        if (typeof evt.beat === 'number') beat = evt.beat
        else if (evt.beat && typeof evt.beat.index === 'number') beat = evt.beat.index
        else if (evt.masterBar && typeof evt.masterBar.index === 'number') beat = evt.masterBar.index

        var payload = {
          type: 'noteEvent',
          midi: midi,
          beat: beat,
        }
        if (typeof evt.fret === 'number') payload.fret = evt.fret
        if (typeof evt.string === 'number') payload.string = evt.string
        if (typeof evt.fret === 'number' && typeof evt.string === 'number') {
          payload.hasExplicitTabPosition = true
        }

        var now = Date.now()
        var elapsed = now - lastNoteEventAt
        if (elapsed < NOTE_EVENT_MIN_MS) {
          pendingNoteEventPayload = payload
          if (!pendingNoteEventTimer) {
            var wait = Math.max(1, NOTE_EVENT_MIN_MS - elapsed)
            pendingNoteEventTimer = setTimeout(flushPendingNoteEventFromMidi, wait)
          }
          return
        }
        if (pendingNoteEventTimer) {
          clearTimeout(pendingNoteEventTimer)
          pendingNoteEventTimer = null
        }
        pendingNoteEventPayload = null
        lastNoteEventAt = now
        postOut(payload)
        bumpRuntimeDiagNote()
      }

      /** Score tap — no 31ms throttle (B4 applies to midiEventsPlayed only). Mirrors AlphaTabWeb.web.tsx. */
      function emitNoteEventFromScoreTap(clientX, clientY) {
        try {
          var rect = container.getBoundingClientRect()
          var x = clientX - rect.left + container.scrollLeft
          var y = clientY - rect.top + container.scrollTop
          var lookup = api.boundsLookup || (api.renderer && api.renderer.boundsLookup)
          if (!lookup || typeof lookup !== 'object') return
          var names = ['getBeatAtPos', 'getBeatAtPosition', 'findBeatAt', 'getBeat']
          for (var ni = 0; ni < names.length; ni++) {
            var fn = lookup[names[ni]]
            if (typeof fn !== 'function') continue
            try {
              var beat = fn.call(lookup, x, y)
              if (!beat || typeof beat !== 'object') continue
              var beatIdx =
                typeof beat.index === 'number'
                  ? beat.index
                  : typeof beat.globalBeatIndex === 'number'
                    ? beat.globalBeatIndex
                    : 0
              var notes = beat.notes
              if (!Array.isArray(notes) || notes.length === 0) continue
              var n0 = notes[0]
              if (!n0 || typeof n0 !== 'object') continue
              var midi = null
              if (typeof n0.noteValue === 'number') midi = n0.noteValue
              else if (typeof n0.noteNumber === 'number') midi = n0.noteNumber
              else if (typeof n0.note === 'number') midi = n0.note
              if (!Number.isFinite(midi)) continue
              var payload = {
                type: 'noteEvent',
                midi: Math.round(midi),
                beat: beatIdx,
                fromScoreTap: true,
              }
              if (typeof n0.fret === 'number') payload.fret = n0.fret
              if (typeof n0.string === 'number') payload.string = n0.string
              if (typeof n0.fret === 'number' && typeof n0.string === 'number') {
                payload.hasExplicitTabPosition = true
              }
              postOut(payload)
              bumpRuntimeDiagNote()
              return
            } catch (eTap) {
              /* try next */
            }
          }
        } catch (e0) {
          /* ignore */
        }
      }

      container.addEventListener('pointerdown', function (ev) {
        if (readOnlyFollowMode) return
        if (ev.button !== 0) return
        emitNoteEventFromScoreTap(ev.clientX, ev.clientY)
      })

      function applyTheme(colors) {
        if (!colors || typeof colors !== 'object') return
        var res = api.settings.display.resources
        Object.keys(colors).forEach(function (k) {
          if (Object.prototype.hasOwnProperty.call(colors, k) && colors[k]) {
            res[k] = colors[k]
          }
        })
        api.updateSettings()
      }

      /**
       * Keep in sync with `src/session/tabThemePresets.ts` (Commit 56).
       * Unknown preset names fall back to `study` in `normalizeHarmoniqPresetName`.
       */
      var HARMONIQ_TAB_PRESETS = {
        listen: {
          scale: 1.1,
          stretchForce: 1,
          colors: {
            mainGlyphColor: '#FFFFFF',
            secondaryGlyphColor: '#E8B86D',
            barSeparatorColor: '#9B8D7B',
            scoreInfoColor: '#8B7D6B',
            staffLineColor: '#9B8D7B',
            barNumberColor: '#8B7D6B',
          },
        },
        study: {
          scale: 1.1,
          stretchForce: 1,
          colors: {
            mainGlyphColor: '#FFFFFF',
            secondaryGlyphColor: '#E8B86D',
            barSeparatorColor: '#9B8D7B',
            scoreInfoColor: '#8B7D6B',
            staffLineColor: '#9B8D7B',
            barNumberColor: '#8B7D6B',
          },
        },
        slow: {
          scale: 1.12,
          stretchForce: 1.02,
          colors: {
            mainGlyphColor: '#FFFFFF',
            secondaryGlyphColor: '#E8B86D',
            barSeparatorColor: '#9B8D7B',
            scoreInfoColor: '#8B7D6B',
            staffLineColor: '#9B8D7B',
            barNumberColor: '#8B7D6B',
          },
        },
        play: {
          scale: 1.08,
          stretchForce: 1,
          colors: {
            mainGlyphColor: '#FFFFFF',
            secondaryGlyphColor: '#E8B86D',
            barSeparatorColor: '#9B8D7B',
            scoreInfoColor: '#8B7D6B',
            staffLineColor: '#9B8D7B',
            barNumberColor: '#8B7D6B',
          },
        },
      }

      function normalizeHarmoniqPresetName(name) {
        var s = String(name == null ? '' : name)
          .trim()
          .toLowerCase()
        if (s === 'listen' || s === 'study' || s === 'slow' || s === 'play') return s
        return 'study'
      }

      function applyRenderPreset(rawName) {
        var key = normalizeHarmoniqPresetName(rawName)
        var p = HARMONIQ_TAB_PRESETS[key] || HARMONIQ_TAB_PRESETS.study
        try {
          var res = api.settings.display.resources
          var cols = p.colors
          Object.keys(cols).forEach(function (k) {
            if (Object.prototype.hasOwnProperty.call(cols, k) && cols[k]) {
              res[k] = cols[k]
            }
          })
          api.settings.display.scale = p.scale
          api.settings.display.stretchForce = p.stretchForce
          api.updateSettings()
          postOut({ type: 'renderPresetApplied', presetName: key })
        } catch (e) {
          postOut({ type: 'error', message: e && e.message ? e.message : 'setRenderPreset failed' })
        }
      }

      function applyTranspose(semitones) {
        var val = Number.isFinite(semitones) ? Math.round(semitones) : 0
        val = Math.max(-12, Math.min(12, val))
        currentTranspose = val
        if (!api.settings.notation) api.settings.notation = {}
        api.settings.notation.transpositionPitches = [val]
        api.updateSettings()
      }

      function harmoniqPitchClassSet(rootMidi, intervals) {
        var set = {}
        var rootPc = ((Math.round(rootMidi) % 12) + 12) % 12
        if (!Array.isArray(intervals)) return set
        for (var i = 0; i < intervals.length; i += 1) {
          var off = intervals[i]
          if (!Number.isFinite(off)) continue
          var pc = (rootPc + off) % 12
          if (pc < 0) pc += 12
          set[pc] = true
        }
        return set
      }

      function harmoniqForEachNote(score, fn) {
        if (!score || !Array.isArray(score.tracks)) return
        for (var ti = 0; ti < score.tracks.length; ti += 1) {
          var track = score.tracks[ti]
          if (!track || !Array.isArray(track.bars)) continue
          for (var bi = 0; bi < track.bars.length; bi += 1) {
            var bar = track.bars[bi]
            if (!bar || !Array.isArray(bar.voices)) continue
            for (var vi = 0; vi < bar.voices.length; vi += 1) {
              var voice = bar.voices[vi]
              if (!voice || !Array.isArray(voice.beats)) continue
              for (var bei = 0; bei < voice.beats.length; bei += 1) {
                var beat = voice.beats[bei]
                if (!beat || !Array.isArray(beat.notes)) continue
                for (var ni = 0; ni < beat.notes.length; ni += 1) {
                  fn(beat.notes[ni])
                }
              }
            }
          }
        }
      }

      function harmoniqNoteMidi(note) {
        if (!note) return null
        if (typeof note.realValue === 'number' && Number.isFinite(note.realValue)) return Math.round(note.realValue)
        if (typeof note.midi === 'number' && Number.isFinite(note.midi)) return Math.round(note.midi)
        return null
      }

      function harmoniqTriggerRender() {
        try {
          if (api.renderer && typeof api.renderer.render === 'function') api.renderer.render()
        } catch (e1) {
          /* ignore */
        }
        try {
          if (typeof api.updateSettings === 'function') api.updateSettings()
        } catch (e2) {
          /* ignore */
        }
      }

      function harmoniqApplyScaleHighlight(rootMidi, intervals) {
        var score = api.score
        var model = typeof alphaTab !== 'undefined' ? alphaTab.model : null
        if (!score || !model || !model.NoteStyle || !model.NoteSubElement || !model.Color) return
        var NoteStyle = model.NoteStyle
        var TabNum = model.NoteSubElement.GuitarTabFretNumber
        var Head = model.NoteSubElement.StandardNotationNoteHead
        if (TabNum == null || Head == null) return
        var tint = model.Color.fromJson('#6EC88C')
        var targets = harmoniqPitchClassSet(rootMidi, intervals)
        harmoniqForEachNote(score, function (note) {
          var md = harmoniqNoteMidi(note)
          if (md == null) return
          var pc = ((md % 12) + 12) % 12
          if (!targets[pc]) return
          var style = new NoteStyle()
          style.colors.set(TabNum, tint)
          style.colors.set(Head, tint)
          note.style = style
        })
        harmoniqTriggerRender()
      }

      function harmoniqClearScaleHighlight() {
        var score = api.score
        if (!score) return
        harmoniqForEachNote(score, function (note) {
          note.style = null
        })
        harmoniqTriggerRender()
      }

      function decodeBase64Strict(raw) {
        var normalized = String(raw || '')
          .replace(/\s/g, '')
          .replace(/-/g, '+')
          .replace(/_/g, '/')
        if (!normalized) return new Uint8Array(0)
        if (/[^A-Za-z0-9+/=]/.test(normalized)) throw new Error('setScore: invalid base64 character')

        var firstEq = normalized.indexOf('=')
        if (firstEq >= 0) {
          if (firstEq < normalized.length - 2) throw new Error('setScore: "=" must be at end')
          if (!/^=+$/.test(normalized.slice(firstEq))) throw new Error('setScore: malformed "=" padding')
        }

        var rem = normalized.length % 4
        if (rem === 1) throw new Error('setScore: invalid base64 length')
        if (firstEq >= 0 && rem !== 0) throw new Error('setScore: padded base64 has invalid length')

        var padded = normalized
        if (rem === 2) padded += '=='
        else if (rem === 3) padded += '='

        var bin = atob(padded)
        if (bin.length < 0) throw new Error('setScore: atob returned negative length')
        var out = new Uint8Array(bin.length)
        for (var i = 0; i < bin.length; i += 1) {
          out[i] = bin.charCodeAt(i)
        }
        return out
      }

      function assertLikelyGpPayload(bytes) {
        if (!bytes || bytes.length < 24) throw new Error('setScore: GP payload too small')
        var preview = ''
        var n = Math.min(bytes.length, 96)
        for (var i = 0; i < n; i += 1) {
          var b = bytes[i]
          preview += b >= 32 && b <= 126 ? String.fromCharCode(b) : ' '
        }
        if (preview.indexOf('FICHIER GUITAR PRO') === -1) {
          throw new Error('setScore: GP payload header mismatch')
        }
      }

      function onInboundMessage(event) {
        var msg = parseInbound(event.data)
        if (!msg || !msg.type) return

        if (msg.type === 'setScore' && msg.gp5Base64) {
          try {
            resetSongMetaForNewScore()
            var bytes = decodeBase64Strict(msg.gp5Base64)
            assertLikelyGpPayload(bytes)
            api.load(bytes.buffer)
            applyTranspose(currentTranspose)
          } catch (e) {
            postOut({ type: 'error', message: (e && e.message) ? e.message : 'setScore: invalid GP5 data' })
          }
          return
        }

        if (msg.type === 'setMusicXml' && typeof msg.musicXml === 'string') {
          try {
            resetSongMetaForNewScore()
            var encoder = new TextEncoder()
            var bytes = encoder.encode(msg.musicXml)
            api.load(bytes.buffer)
            applyTranspose(currentTranspose)
          } catch (e) {
            postOut({ type: 'error', message: (e && e.message) ? e.message : 'setMusicXml: invalid MusicXML data' })
          }
          return
        }

        if (msg.type === 'setAudioSrc' && typeof msg.audioSrc === 'string') {
          externalAudio.src = msg.audioSrc
          externalAudio.load()
          updatePositionFromAudio()
          return
        }

        if (msg.type === 'setPlaybackRate' && typeof msg.playbackRate === 'number') {
          stemPlaybackRate = Number.isFinite(msg.playbackRate) ? Math.max(0.25, Math.min(1.25, msg.playbackRate)) : 1
          externalAudio.playbackRate = stemPlaybackRate
          applyStemPlaybackSpeedToApi()
          updatePositionFromAudio()
          return
        }

        if (msg.type === 'setReadOnlyFollowMode' && typeof msg.enabled === 'boolean') {
          readOnlyFollowMode = !!msg.enabled
          return
        }

        if (msg.type === 'seekTo' && typeof msg.positionMs === 'number') {
          var seekMs = Math.max(0, msg.positionMs)
          var prSeek = stemPlaybackRate
          externalAudio.currentTime = (seekMs * prSeek) / 1000
          try {
            if (api.player && api.player.output && typeof api.player.output.updatePosition === 'function') {
              api.player.output.updatePosition(seekMs)
            }
          } catch (e) {
            postOut({ type: 'error', message: (e && e.message) ? e.message : 'seekTo failed' })
          }
          maybePostSongPlayback()
          return
        }

        if (msg.type === 'scrollMasterBarIntoView' && typeof msg.barIndex === 'number') {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              scrollMasterBarIntoViewBar(msg.barIndex, 0)
            })
          })
          return
        }

        if (msg.type === 'syncTimelineMs' && typeof msg.positionMs === 'number') {
          var syncMs = Math.max(0, msg.positionMs)
          try {
            if (api.player && api.player.output && typeof api.player.output.updatePosition === 'function') {
              api.player.output.updatePosition(syncMs)
            }
          } catch (e) {
            postOut({ type: 'error', message: (e && e.message) ? e.message : 'syncTimelineMs failed' })
          }
          if (runtimeDiagEnabled) {
            try {
              var tp = api.timePosition
              if (typeof tp === 'number' && Number.isFinite(tp)) {
                rdDriftSum += Math.abs(syncMs - tp)
                rdDriftN += 1
              }
            } catch (eR) {
              /* ignore */
            }
          }
          maybePostSongPlayback()
          return
        }

        if (msg.type === 'setRuntimeDiagnosticsEnabled' && typeof msg.enabled === 'boolean') {
          setRuntimeDiagEnabled(msg.enabled)
          return
        }

        if (msg.type === 'diagPing' && typeof msg.requestId === 'string' && typeof msg.t0 === 'number') {
          postOut({ type: 'diagPong', requestId: msg.requestId, t0: msg.t0 })
          return
        }

        if (msg.type === 'setStemPlaybackActive' && typeof msg.active === 'boolean') {
          try {
            if (msg.active) {
              if (typeof api.play === 'function') api.play()
            } else {
              if (typeof api.pause === 'function') api.pause()
            }
          } catch (e) {
            postOut({ type: 'error', message: (e && e.message) ? e.message : 'setStemPlaybackActive failed' })
          }
          return
        }

        if (msg.type === 'getPosition') {
          var prGet = stemPlaybackRate
          if (!Number.isFinite(prGet) || prGet < 0.25) prGet = 1
          postOut({ type: 'position', positionMs: (externalAudio.currentTime / prGet) * 1000 })
          return
        }

        if (msg.type === 'getSongDetails') {
          var ridSd = typeof msg.requestId === 'string' ? msg.requestId : undefined
          postSongDetailsPayload(ridSd ? { requestId: ridSd } : undefined)
          return
        }

        if (msg.type === 'setRenderPreset') {
          applyRenderPreset(msg.presetName)
          return
        }

        if (msg.type === 'setSoundFontProfile' && typeof msg.profileId === 'string') {
          var pid =
            msg.profileId === 'fluid_r3_mono' || msg.profileId === 'general_user'
              ? msg.profileId
              : DEFAULT_SOUNDFONT_PROFILE_ID
          if (pid === currentSoundFontProfileId) {
            postOut({ type: 'soundFontLoad', status: 'loaded', profileId: pid })
          } else {
            applySoundFontProfile(pid, false)
          }
          return
        }

        if (msg.type === 'setTheme' && msg.colors) {
          applyTheme(msg.colors)
          return
        }

        if (msg.type === 'setRenderPreset' && msg.presetName) {
          var isLight = msg.presetName === 'light'
          document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark')
          return
        }

        if (msg.type === 'setTranspose') {
          applyTranspose(msg.semitones)
          return
        }

        if (
          msg.type === 'setLoopRegion' &&
          typeof msg.startBarIndex === 'number' &&
          typeof msg.endBarIndexExclusive === 'number'
        ) {
          loopState = {
            startBarIndex: Math.max(0, Math.floor(msg.startBarIndex)),
            endBarIndexExclusive: Math.max(0, Math.floor(msg.endBarIndexExclusive)),
          }
          layoutLoopBracket()
          return
        }

        if (msg.type === 'clearLoopRegion') {
          hideLoopBracket()
          return
        }

        if (msg.type === 'highlightScaleDegrees' && typeof msg.rootMidi === 'number' && Array.isArray(msg.intervals)) {
          harmoniqApplyScaleHighlight(msg.rootMidi, msg.intervals)
          return
        }

        if (msg.type === 'clearScaleHighlight') {
          harmoniqClearScaleHighlight()
          return
        }
      }

      window.addEventListener('message', onInboundMessage)
      document.addEventListener('message', onInboundMessage)

      api.error.on(function (err) {
        var m = err && (err.message || err.toString())
        postOut({ type: 'error', message: m || 'AlphaTab error' })
      })

      var midiPlayed = (api.player && api.player.midiEventsPlayed) || api.midiEventsPlayed
      if (midiPlayed && typeof midiPlayed.on === 'function') {
        midiPlayed.on(function (evt) {
          emitNoteEventFromMidiEvent(evt)
        })
      }

      /** First completed render — includes initial empty layout; later re-renders do not re-send. */
      var readyPosted = false
      api.renderFinished.on(function () {
        if (runtimeDiagEnabled) rdWindowRender += 1
        layoutLoopBracket()
        postSongDetailsPayload(undefined)
        maybePostSongPlayback()
        if (readyPosted) return
        wireExternalMediaHandler()
        applyStemPlaybackSpeedToApi()
        readyPosted = true
        postOut({ type: 'ready' })
      })
    })()
  </script>
</body>
</html>
