<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Harmoniq — AlphaTab harness</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #2B1D0E;
      overflow-x: hidden;
      -webkit-touch-callout: none;
      user-select: none;
    }
    #alphatab { width: 100%; min-height: 100vh; }
  </style>
</head>
<body>
  <div id="alphatab"></div>
  <!-- Pinned — never use @latest (PRIORITIES 0.4) -->
  <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.3.1/dist/alphaTab.min.js"></script>
  <script>
    (function () {
      'use strict'

      function preventUiHooks() {
        document.addEventListener('contextmenu', function (e) {
          e.preventDefault()
        }, { capture: true })
        document.addEventListener('click', function (e) {
          var t = e.target
          if (!t || !t.closest) return
          var a = t.closest('a[href]')
          if (a && a.getAttribute('href') && a.getAttribute('href') !== '#') {
            e.preventDefault()
            e.stopPropagation()
          }
        }, true)
      }

      preventUiHooks()

      var container = document.getElementById('alphatab')
      if (!container || typeof alphaTab === 'undefined' || !alphaTab.AlphaTabApi) {
        console.error('Harmoniq harness: AlphaTab failed to load')
        return
      }

      var api = new alphaTab.AlphaTabApi(container, {
        core: {
          useWorkers: false,
          enableLazyLoading: false,
          scriptFile: 'https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.3.1/dist/alphaTab.min.js',
        },
        display: {
          resources: {
            mainGlyphColor: '#F0DEB4',
            secondaryGlyphColor: '#D4A574',
            barSeparatorColor: '#5C4535',
            scoreInfoColor: '#A08060',
            staffLineColor: '#5C4535',
            barNumberColor: '#8B7D6B',
          },
          scale: 1.1,
        },
        player: { enablePlayer: false },
      })

      function postOut(msg) {
        try {
          var data = JSON.stringify(msg)
          if (window.ReactNativeWebView && typeof window.ReactNativeWebView.postMessage === 'function') {
            window.ReactNativeWebView.postMessage(data)
          }
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(data, '*')
          }
        } catch (err) {
          console.warn('Harmoniq harness postOut', err)
        }
      }

      function parseInbound(data) {
        if (data == null) return null
        if (typeof data === 'string') {
          try {
            return JSON.parse(data)
          } catch (_) {
            return null
          }
        }
        if (typeof data === 'object' && data.type) return data
        return null
      }

      function scrollToBarIndex(barIndex) {
        var lookup = api.boundsLookup
        if (!lookup || !lookup.isFinished) {
          postOut({ type: 'error', message: 'scrollToBar: bounds not ready yet' })
          return
        }
        var mb = lookup.findMasterBarByIndex(barIndex)
        if (!mb) {
          postOut({ type: 'error', message: 'scrollToBar: unknown bar index ' + barIndex })
          return
        }
        try {
          var scrollEl = api.uiFacade.getScrollContainer()
          var y = mb.visualBounds.y
          api.uiFacade.scrollToY(scrollEl, Math.max(0, y - 24), 200)
        } catch (e) {
          postOut({ type: 'error', message: (e && e.message) ? e.message : 'scrollToBar failed' })
        }
      }

      function applyTheme(colors) {
        if (!colors || typeof colors !== 'object') return
        var res = api.settings.display.resources
        Object.keys(colors).forEach(function (k) {
          if (Object.prototype.hasOwnProperty.call(colors, k) && colors[k]) {
            res[k] = colors[k]
          }
        })
        api.updateSettings()
      }

      function onInboundMessage(event) {
        var msg = parseInbound(event.data)
        if (!msg || !msg.type) return

        if (msg.type === 'setScore' && msg.gp5Base64) {
          try {
            var bytes = Uint8Array.from(atob(msg.gp5Base64), function (c) {
              return c.charCodeAt(0)
            })
            api.load(bytes.buffer)
          } catch (e) {
            postOut({ type: 'error', message: (e && e.message) ? e.message : 'setScore: invalid GP5 data' })
          }
          return
        }

        if (msg.type === 'scrollToBar' && typeof msg.barIndex === 'number') {
          scrollToBarIndex(msg.barIndex)
          return
        }

        if (msg.type === 'setTheme' && msg.colors) {
          applyTheme(msg.colors)
        }
      }

      window.addEventListener('message', onInboundMessage)
      document.addEventListener('message', onInboundMessage)

      api.error.on(function (err) {
        var m = err && (err.message || err.toString())
        postOut({ type: 'error', message: m || 'AlphaTab error' })
      })

      /** First completed render — includes initial empty layout; later re-renders do not re-send. */
      var readyPosted = false
      api.renderFinished.on(function () {
        if (readyPosted) return
        readyPosted = true
        postOut({ type: 'ready' })
      })
    })()
  </script>
</body>
</html>
