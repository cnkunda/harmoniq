name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: TypeScript lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: tsc --noEmit
        run: npm run lint

  frontend-tests:
    name: Vitest (all unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all unit tests with coverage
        run: npm run test -- --coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage
          retention-days: 7

  python-lint:
    name: Ruff (Python lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff==0.16.0

      - name: Ruff check
        run: >-
          ruff check backend/app backend/tests
          --select E9,F63,F7,F82
          --output-format=github

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Docker-relevant changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^(backend/Dockerfile|backend/\.dockerignore|docker-compose\.yml|backend/pyproject\.toml|backend/README\.md)$'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        if: steps.changes.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          tags: harmoniq-backend:ci
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=min

  playwright-smoke:
    name: Playwright route smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run @smoke route checks
        run: npm run test:ui -- --grep @smoke

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: artifacts/playwright
          retention-days: 7

  backend-tests:
    name: Pytest (full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install backend + dev deps
        run: pip install -e ".[dev,training]" -c constraints.txt

      - name: Audit Python dependencies
        shell: bash
        run: |
          python -m pip install "pip-audit==2.10.1"
          set +e
          pip-audit --no-deps -r constraints.txt --format json --output pip-audit.json
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "pip-audit failed with exit code $code"
            exit "$code"
          fi
          python scripts/check_pip_audit.py pip-audit.json

      # PRs run the curated subset; pushes to main run the full suite.
      - name: Run tests (PR subset)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rs \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing:skip-covered \
            --cov-report=html:htmlcov \
            --cov-report=xml:coverage.xml \
            tests/test_cqt_features.py \
            tests/test_chord_augmentation.py \
            tests/test_chord_metrics.py \
            tests/test_inference_logic.py \
            tests/test_key_detection.py \
            tests/test_viterbi_decoder.py \
            tests/test_viterbi_chord_progression.py \
            tests/test_chord_transitions.py \
            tests/test_basic_pitch_cache.py \
            tests/test_llm_auth_guard.py \
            tests/test_boundary_tie.py \
            tests/test_chord_vocab.py \
            tests/test_guitarset_pipeline.py \
            tests/test_e2e_data_pipeline.py \
            tests/test_commit159_feedback.py \
            tests/test_jam_scoring.py \
            tests/test_jam_summary.py \
            tests/test_sequencer.py \
            tests/test_practice_plan_api.py \
            tests/test_plan_adapter.py \
            tests/test_audio_quality.py \
            tests/test_audio_fingerprint.py \
            tests/test_commit171_audio_cache.py \
            tests/test_stem_export.py \
            tests/test_rwc_pipeline.py \
            tests/test_tab_assignment.py \
            tests/test_tab_positions.py \
            tests/test_tab_rhythm.py \
            tests/test_musicxml_builder.py \
            tests/test_corrections.py \
            tests/test_corrections_dataset.py \
            tests/test_part_role.py \
            tests/test_solo_branch.py \
            tests/test_music_generation.py \
            tests/test_backing_postprocess.py \
            tests/test_orient_clip.py \
            | tee pytest.log

      - name: Run tests (full suite)
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          HARMONIQ_SKIP_DEMUCS: "1"
          HARMONIQ_SKIP_STEMS: "1"
          HARMONIQ_SKIP_WHISPER: "1"
          HARMONIQ_SKIP_BASIC_PITCH: "1"
          HARMONIQ_SKIP_PRERENDER: "1"
          HARMONIQ_SKIP_SPOTIFY: "1"
          HARMONIQ_SKIP_SPOTIFY_PLAYBACK: "1"
          HARMONIQ_SKIP_TASTE_DERIVE: "1"
          HARMONIQ_SKIP_CURRICULUM: "1"
          HARMONIQ_SKIP_PRACTICE_PLAN: "1"
          HARMONIQ_SKIP_STYLE_DETECT: "1"
          HARMONIQ_SKIP_SKILL_MUTATION: "1"
        run: |
          set -o pipefail
          python -m pytest -q -rs \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing:skip-covered \
            --cov-report=html:htmlcov \
            --cov-report=xml:coverage.xml | tee pytest.log

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov
          retention-days: 7

      - name: Assert ffmpeg-guarded tests did not skip
        shell: bash
        run: |
          if grep -q "ffmpeg not available" pytest.log; then
            echo "::error::ffmpeg-guarded audio tests skipped even though ffmpeg is installed"
            grep "ffmpeg not available" pytest.log
            exit 1
          fi
