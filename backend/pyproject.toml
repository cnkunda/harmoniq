[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harmoniq-backend"
version = "0.1.0"
description = "Harmoniq local analysis API (FastAPI scaffold)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "setuptools>=65.0",  # pkg_resources (resampy/librosa); often missing on py3.12+ minimal venvs
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "anthropic>=0.40.0",
    "tenacity>=8.0.0",  # app/retry.py backoff decorators (was imported but undeclared)
    "yt-dlp>=2024.8.0",
    "librosa>=0.10.2",
    "openai-whisper>=20231117",
    "pyguitarpro>=0.10.0",
    "music21>=9.1",  # MusicXML generation (was only in requirements.txt, missing from the CI install path)
    # Demucs uses torchaudio.save(); torchaudio 2.9+ routes save through TorchCodec, which is
    # painful on Windows (libtorchcodec + FFmpeg shared DLLs). Pin a 2.5.x pair that still
    # uses the classic backends. Remove these pins if you intentionally standardize on TorchCodec.
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "demucs>=4.0.1",
    "mido>=1.3.3",
    "pretty_midi>=0.2.10",
    "soundfile>=0.12.0",
    "scikit-learn>=1.3.0",
    # Commit 106: Quantization-Aware Training — requires TF>=2.15
    "tensorflow-model-optimization>=0.8.0",
]

# basic-pitch is no longer the primary solo transcription engine (replaced by MT3).
# Retained as fallback when MT3 is unavailable.
# macOS: `pip install -e ".[basicpitch]"` usually succeeds.
[project.optional-dependencies]
basicpitch = [
    "basic-pitch>=0.4.0",
]
mt3 = [
    "mt3 @ git+https://github.com/magenta/mt3.git",
    "note-seq>=0.0.1",
    # JAX 0.4.20+ required for Python 3.12 compatibility (PyObject_Vectorcall).
    # Install separately: pip install jax>=0.4.20 jaxlib>=0.4.20
]
mrt2 = [
    "magenta-rt>=2.0",
]
dev = [
    "httpx>=0.27.0",
    "lxml>=5.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]
db = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
]
redis = [
    "redis[hiredis]>=5.1.0",
]
celery = [
    "celery>=5.4.0",
]
notebook = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # audioread still imports stdlib modules deprecated for removal in Python 3.13 (aifc, audioop, sunau).
    "ignore::DeprecationWarning:audioread.*",
    # Librosa can hit short internal frames during chroma_cqt; harmless for our summarize smoke test.
    "ignore:n_fft=1024 is too large for input signal:UserWarning",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
