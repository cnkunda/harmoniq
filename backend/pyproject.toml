[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harmoniq-backend"
version = "0.1.0"
description = "Harmoniq local analysis API (FastAPI scaffold)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "setuptools>=65.0",  # pkg_resources (resampy/librosa); often missing on py3.12+ minimal venvs
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "anthropic>=0.40.0",
    "yt-dlp>=2024.8.0",
    "librosa>=0.10.2",
    "openai-whisper>=20231117",
    "pyguitarpro>=0.10.0",
    # Demucs uses torchaudio.save(); torchaudio 2.9+ routes save through TorchCodec, which is
    # painful on Windows (libtorchcodec + FFmpeg shared DLLs). Pin a 2.5.x pair that still
    # uses the classic backends. Remove these pins if you intentionally standardize on TorchCodec.
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "demucs>=4.0.1",
    "mido>=1.3.3",
]

# basic-pitch is part of the Harmoniq stack (README / PRIORITIES) but pins TensorFlow in a way
# that does not resolve on Windows or Linux with Python 3.11+ (non-macOS). Install when needed:
#   pip install -e ".[basicpitch]"
# On macOS, `pip install -e ".[basicpitch]"` usually succeeds.
[project.optional-dependencies]
basicpitch = [
    "basic-pitch>=0.4.0",
]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0",
]
notebook = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # audioread still imports stdlib modules deprecated for removal in Python 3.13 (aifc, audioop, sunau).
    "ignore::DeprecationWarning:audioread.*",
    # Librosa can hit short internal frames during chroma_cqt; harmless for our summarize smoke test.
    "ignore:n_fft=1024 is too large for input signal:UserWarning",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
